<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login Admin Hotel XYZ">
    <title>Login Admin - Hotel R&R</title>
    <link rel="stylesheet" href="form-login.css">
</head>
<body>
    <header>
        <div class="navbar">
            <h1>Hotel R&R - Admin Login</h1>
        </div>
    </header>

    <section class="login-form">
        <h2>Login Admin</h2>
        <form action="admin-dashboard.html" method="GET">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2024 Hotel R&R</p>
    </footer>
</body>
</html>
